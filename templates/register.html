<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear cuenta · Biblioteca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <main class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
        <section class="card shadow-sm w-100" style="max-width: 460px;">
            <div class="card-body p-4">
                <h1 class="h3 text-center mb-1">Crear cuenta</h1>
                <p class="text-secondary text-center mb-4">Las cuentas nuevas tienen permisos de usuario normal</p>

                {% for category, message in get_flashed_messages(with_categories=true) %}
                <div class="alert alert-{{ category }}" role="alert">{{ message }}</div>
                {% endfor %}

                <form method="post">
                    <div class="mb-3">
                        <label for="name" class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="name" name="name" autocomplete="name" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Correo electrónico</label>
                        <input type="email" class="form-control" id="email" name="email" autocomplete="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Contraseña (mínimo 8 caracteres)</label>
                        <input type="password" class="form-control" id="password" name="password" autocomplete="new-password" minlength="8" required>
                    </div>
                    <div class="mb-3">
                        <label for="password_confirmation" class="form-label">Repetir contraseña</label>
                        <input type="password" class="form-control" id="password_confirmation" name="password_confirmation" autocomplete="new-password" minlength="8" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Crear cuenta</button>
                </form>

                <p class="text-center mt-3 mb-0">
                    ¿Ya tienes cuenta? <a href="{{ url_for('index') }}">Inicia sesión</a>
                </p>
            </div>
        </section>
    </main>
</body>
</html>
