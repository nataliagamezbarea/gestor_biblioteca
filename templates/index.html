<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Biblioteca</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-4xl mx-auto bg-white p-6 rounded shadow">
        <h1 class="text-2xl font-bold mb-4">Gestión de Biblioteca</h1>
        
        <div class="grid grid-cols-2 gap-4 mb-6">
            <!-- Formulario Rápido Agregar Libro -->
            <form id="book-form" class="border p-4 rounded">
                <h2 class="font-bold mb-2">Registrar Libro</h2>
                <input type="text" id="title" placeholder="Título" class="border w-full mb-2 p-1" required>
                <input type="text" id="author" placeholder="Autor" class="border w-full mb-2 p-1" required>
                <input type="text" id="isbn" placeholder="ISBN" class="border w-full mb-2 p-1" required>
                <input type="number" id="copies" placeholder="Ejemplares" class="border w-full mb-2 p-1" value="1">
                <button type="submit" class="bg-blue-500 text-white px-4 py-1 rounded">Guardar</button>
            </form>

            <!-- Formulario Rápido Registrar Usuario -->
            <form id="user-form" class="border p-4 rounded">
                <h2 class="font-bold mb-2">Registrar Usuario</h2>
                <input type="text" id="name" placeholder="Nombre completo" class="border w-full mb-2 p-1" required>
                <input type="email" id="email" placeholder="Correo" class="border w-full mb-2 p-1" required>
                <select id="role" class="border w-full mb-2 p-1">
                    <option value="Alumno">Alumno</option>
                    <option value="Profesor">Profesor</option>
                </select>
                <button type="submit" class="bg-green-500 text-white px-4 py-1 rounded">Guardar</button>
            </form>
        </div>

        <p class="text-sm text-gray-500">Usa las rutas <code>/api/books</code>, <code>/api/users</code> y <code>/api/loans</code> para interactuar con la API REST.</p>
    </div>

    <script>
        document.getElementById('book-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            await fetch('/api/books', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    title: document.getElementById('title').value,
                    author: document.getElementById('author').value,
                    isbn: document.getElementById('isbn').value,
                    copies: document.getElementById('copies').value
                })
            });
            alert('Libro registrado');
            e.target.reset();
        });

        document.getElementById('user-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            await fetch('/api/users', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: document.getElementById('name').value,
                    email: document.getElementById('email').value,
                    role: document.getElementById('role').value
                })
            });
            alert('Usuario registrado');
            e.target.reset();
        });
    </script>
</body>
</html>
