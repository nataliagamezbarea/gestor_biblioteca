<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión · Biblioteca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <main class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
        <section class="card shadow-sm w-100" style="max-width: 420px;">
            <div class="card-body p-4">
                <h1 class="h3 text-center mb-1">Biblioteca</h1>
                <p class="text-secondary text-center mb-4">Inicia sesión para continuar</p>

                {% for category, message in get_flashed_messages(with_categories=true) %}
                <div class="alert alert-{{ category }}" role="alert">{{ message }}</div>
                {% endfor %}

                <form method="post">
                    <div class="mb-3">
                        <label for="email" class="form-label">Correo electrónico</label>
                        <input type="email" class="form-control" id="email" name="email" autocomplete="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="password" name="password" autocomplete="current-password" required>
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="remember_me" name="remember_me">
                        <label class="form-check-label" for="remember_me">Recordarme durante 30 días</label>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Iniciar sesión</button>
                </form>

                <p class="text-center mt-3 mb-0">
                    ¿Primera vez? <a href="{{ url_for('main.register') }}">Crear cuenta</a>
                </p>
                <p class="text-center mt-2 mb-0">
                    <a href="{{ url_for('main.catalog_page') }}">Consultar catálogo público</a>
                </p>
            </div>
        </section>
    </main>
</body>
</html>
