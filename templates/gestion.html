<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestión · Biblioteca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="{{ url_for('dashboard.index') }}">Biblioteca</a>
            <a class="btn btn-outline-light btn-sm" href="{{ url_for('dashboard.index') }}">Volver al panel</a>
        </div>
    </nav>

    <main class="container py-4">
        <h1 class="h3 mb-4">Gestión de biblioteca</h1>
        <div id="feedback" class="alert d-none" role="alert"></div>
        <div class="row g-4">
            <div class="col-12 col-lg-6">
                <section class="card shadow-sm h-100">
                    <div class="card-body">
                        <h2 class="h5 mb-3">Añadir libro</h2>
                        <form id="book-form">
                            <div class="mb-3">
                                <label for="title" class="form-label">Título</label>
                                <input class="form-control" id="title" required>
                            </div>
                            <div class="mb-3">
                                <label for="author" class="form-label">Autor</label>
                                <input class="form-control" id="author" required>
                            </div>
                            <div class="mb-3">
                                <label for="isbn" class="form-label">ISBN</label>
                                <input class="form-control" id="isbn" required>
                            </div>
                            <div class="mb-3">
                                <label for="copies" class="form-label">Ejemplares</label>
                                <input class="form-control" type="number" id="copies" value="1" min="1" required>
                            </div>
                            <button class="btn btn-primary" type="submit">Guardar libro</button>
                        </form>
                    </div>
                </section>
            </div>

            <div class="col-12 col-lg-6">
                <section class="card shadow-sm h-100">
                    <div class="card-body">
                        <h2 class="h5 mb-3">Crear usuario</h2>
                        <form id="user-form">
                            <div class="mb-3">
                                <label for="name" class="form-label">Nombre</label>
                                <input class="form-control" id="name" required>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Correo electrónico</label>
                                <input class="form-control" type="email" id="email" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Contraseña (mínimo 8 caracteres)</label>
                                <input class="form-control" type="password" id="password" minlength="8" required>
                            </div>
                            <button class="btn btn-primary" type="submit">Crear usuario normal</button>
                        </form>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <script src="{{ url_for('static', filename='js/gestion.js') }}" defer></script>
</body>
</html>
